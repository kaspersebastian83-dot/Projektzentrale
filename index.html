    <li><b>Projektzentrale:</b> Projekt wählen. Rechts stehen die Arbeitsschritte als Karten untereinander – die gefüllte Karte ist der nächste Schritt, ✓ heißt erledigt. Oben unter <b>„Projektdaten“</b> mit <b>„Arbeitszettel einlesen …“</b> das PDF des Büro-Systems übernehmen (jeder Wert wird vor dem Speichern gezeigt) oder Objekt, Auftraggeber, Schadendatum … von Hand ergänzen; alle Apps übernehmen sie. Unter <b>„Verteiler“</b> festhalten, wer das Gutachten bekommt und wann es versandt wurde.</li>
    <li><b>① LabelKit – Proben erfassen:</b> Proben anlegen, Etiketten drucken, Laborübergabe erstellen, <b>Strg+S</b>. Alles landet in „Laboraufträge“.</li>
    <li><b>② FotoKit – Fotos bearbeiten:</b> Fotos benennen und die Bilddokumentation als PDF erstellen (Ordner „Fotos“).</li>
    <li><b>③ PlanKit – Plan bearbeiten:</b> Grundriss aus „Pläne“ wählen. Unter „Laborbericht importieren …“ die <b>Probenerfassung aus LabelKit</b> übernehmen und die Proben auf den Plan ziehen.</li>
    <li><b>Laborbericht da:</b> XML und PDF in „Laborergebnisse“ ablegen. In PlanKit den Bericht importieren und <b>„Alle Konflikte: Aktualisieren“</b> klicken – die Messwerte hängen dann an den Proben.</li>
    <li><b>Auswerten:</b> PlanKit „Ergebnisse“ → Ergebniskarte exportieren. FotoKit „Ergebnistabelle …“ → Tabelle für Word.</li>
    <li><b>④ BelegKit – Abrechnung:</b> Jede Person trägt ihre Ortstermine (Stunden, km, Spesen, Übernachtung) und Auswertungsstunden selbst ein. Proben aus LabelKit, Berichtsseiten und Fotos werden gezählt; „Abrechnung“ zeigt alle Positionen mit Nummern zum Übertragen ins Rechnungsprogramm.</li>
    <li><b>Anlage Probenahme:</b> An der Karte PlanKit „Anlage Probenahme · Erstellen …“ (sobald ein Plan da ist) – PlanKit öffnet den Export mit „Word · Anlage Probenahme“ (Lagepläne, Probenverzeichnis, Ausschnitte, Fotos, Laborwerte).</li>
    <li><b>Anlagen PN 98 / Brandgeruch:</b> An der Karte LabelKit „Anlage PN 98 / Brandgeruch · Erstellen …“ (sobald LabelKit PN 98-Protokolle oder Brandgeruch-Proben enthält). Die Datei liegt danach in „Mitteilungen“ – in Word an der gewünschten Stelle <b>Einfügen › Objekt › Text aus Datei</b>.</li>
  </ol>
  <h4>Gut zu wissen</h4>
  <ul>
    <li><b>Speichern:</b> PlanKit speichert jede Änderung selbst in „Pläne“. In LabelKit genügt <b>Strg+S</b>, ohne Ordnerdialog. FotoKit benennt die Fotos direkt im Ordner um.</li>
    <li><b>Zu zweit am selben Projekt:</b> Hat ein Kollege zwischendurch gespeichert, fragt PlanKit nach, statt zu überschreiben. FotoKit führt beide Fassungen zusammen.</li>
    <li><b>Ersetzen:</b> Lädt man in PlanKit einen neuen Grundriss, bleibt die alte Datei als „(vorher …)“-Kopie in „Pläne“.</li>
    <li><b>Mehrere Geschosse:</b> In PlanKit unten „＋ Plan“ (EG, 1. OG …). Probennummern laufen über alle Geschosse weiter. Eine mehrseitige PDF mit „Alle Seiten als einzelne Pläne“ übernehmen.</li>
    <li><b>Ergebniskarte:</b> In PlanKit „Ergebnisse“ (Taste K) färbt die Proben nach der Bewertungsskala – dieselbe wie in der FotoKit-Ergebnistabelle. Beim Export „Darstellung: Ergebniskarte“ wählen.</li>
    <li><b>Hilfe:</b> In jeder App erklärt der <b>?</b>-Knopf (oder F1) die Bedienung.</li>
    <li><b>Problem melden:</b> In FotoKit „Problem melden“, sonst Screenshot und kurze Beschreibung an <b>sebastian.kasper@dr-schiffers.de</b>.</li>
  </ul>
  <h4>Adressen</h4>
  <table>
    <tr><td>Projektzentrale</td><td>Projekte, Projektdaten, Start der Apps</td><td>kaspersebastian83-dot.github.io/Projektzentrale</td></tr>
    <tr><td>LabelKit</td><td>Proben erfassen, Etiketten, Laborübergabe</td><td>kaspersebastian83-dot.github.io/labelkit</td></tr>
    <tr><td>BelegKit</td><td>Zeiten, km, Spesen, Proben, Berichtsseiten für die Rechnung</td><td>kaspersebastian83-dot.github.io/aufwandkit</td></tr>
    <tr><td>FotoKit</td><td>Fotos benennen, Bilddokumentation, Ergebnistabelle</td><td>kaspersebastian83-dot.github.io/Bildumbenenner</td></tr>
    <tr><td>PlanKit</td><td>Probenplan, Ergebniskarte</td><td>kaspersebastian83-dot.github.io/Probenplan</td></tr>
  </table>
  <p>Alle Daten bleiben auf dem Server im Archivordner. Die Apps laden nichts hoch.</p>`;
}

    <div class="btns"><button id="hPrint">Drucken / PDF</button><button class="primary" id="hClose">Schließen</button></div>`);
  $('dialog').classList.add('help');
  $('hClose').onclick = closeDialog;
  $('hPrint').onclick = () => {
    const w = window.open('', '_blank'); if (!w) return;
    const css = getComputedStyle(document.documentElement), v = n => css.getPropertyValue(n).trim();
    w.document.write(`<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Kurzanleitung – Projekt-Apps</title><style>
      :root{--text:#1d2a33;--muted:#5f6f7d;--accent:${v('--accent') || '#3f7cc0'};--panel2:#f1f5f9;--mono:Consolas,monospace}
      body{font:11pt/1.45 "Segoe UI",Arial,sans-serif;color:#1d2a33;margin:14mm 16mm}h1{font-size:17pt;margin:0 0 6px}h4{font-size:12pt;margin:12px 0 4px}
      ol,ul{padding-left:20px;margin:3px 0}li,p{margin:2px 0}svg{width:100%;height:auto}.cap{font-size:9pt;color:#5f6f7d}table{border-collapse:collapse}td{padding:2px 10px 2px 0;font-size:10pt}td:first-child{font-weight:600}code{font-family:Consolas,monospace}
      @page{size:A4;margin:0}</style></head><body><h1>Kurzanleitung – Projekt-Apps</h1>${helpHtml()}<script>window.onload=()=>window.print()<\/script></body></html>`);
    w.document.close();
  };
}
$('btnHelp').onclick = openHelp;
document.addEventListener('click', e => { if (e.target.closest && e.target.closest('[data-help]')) openHelp(); });
document.addEventListener('keydown', e => { if (e.key === 'F1'){ e.preventDefault(); openHelp(); } });

$('btnUpd').onclick = async () => { await flushPJ(); location.reload(); };
$('btnArchive').onclick = pickArchive;
$('btnRescan').onclick = async () => { await flushPJ(); S.projects.forEach(p => p.st = null); await listProjects(); };
$('q').addEventListener('input', () => { S.q = $('q').value; renderList(); });
$('dlgBack').addEventListener('click', e => { if (e.target === $('dlgBack')) closeDialog(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('dlgBack').classList.contains('show')) closeDialog(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushPJ(); });
window.addEventListener('beforeunload', e => { if (Object.keys(S.pjDirty).length){ flushPJ(); e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('focus', () => { const p = S.sel; if (p && !Object.keys(S.pjDirty).length) readPJ(p.handle).then(pj => {   // pick up changes from Bildumbenenner / coworkers
  // inzwischen ein anderes Projekt gewählt? Dann gehören Daten und Ordnerstand nicht zu ihm
  if (S.sel !== p || Object.keys(S.pjDirty).length || JSON.stringify(pj.data) === JSON.stringify(S.pj && S.pj.data)) return;
  S.pj = pj; scanProject(p).then(st => { p.st = st; updateRow(p); if (S.sel === p) renderDetail(); });
}); });

restoreArchive();
})();
</script>
