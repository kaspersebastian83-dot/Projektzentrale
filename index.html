:root{
  --bg:#eef4fb; --panel:#ffffff; --panel2:#f4f9fe; --line:#dce8f5; --line2:#c2d6ec; --text:#21303e; --muted:#6b8199;
  --accent:#3f7cc0; --accent-2:#356aa8; --accent-l:#5a93d0; --head:#4179b2; --ok:#2e7d4f; --warn:#9a5b00; --err:#c0392b;
  --focus:#e6f0fb; --on-accent:#fff; --primary:#3f7cc0; --primary-h:#5a93d0; --shadow:0 1px 2px rgba(40,72,116,.05),0 1px 3px rgba(40,72,116,.07);
  --sans:'IBM Plex Sans',"Segoe UI",system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#131b24; --panel:#1a2430; --panel2:#202c3a; --line:#2c3b4d; --line2:#3a4d63; --text:#e3ebf3; --muted:#93a7bc;
    --accent:#6fa3dc; --accent-2:#5a93d0; --accent-l:#8bb8e6; --head:#24476d; --ok:#6cc08a; --warn:#e2b34f; --err:#f07a70; --focus:#1f3247; --on-accent:#fff; --primary:#3a73b3; --primary-h:#4a84c4;
    --shadow:0 1px 3px rgba(0,0,0,.35); }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line2);background:var(--panel);border-radius:7px;padding:6px 13px;transition:background .12s,border-color .12s,box-shadow .12s}
button:hover{border-color:var(--accent-l);color:var(--accent)}
button.primary{background:var(--primary);border-color:var(--accent-2);color:var(--on-accent);font-weight:600;box-shadow:0 2px 6px rgba(26,74,122,.22)}
button.primary:hover{background:var(--primary-h);color:var(--on-accent);box-shadow:0 3px 10px rgba(26,74,122,.3)}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=search],input[type=date],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 9px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[readonly]{background:var(--panel2);color:var(--muted)}

/* Kopf wie LabelKit/FotoKit: blaue App-Leiste + weiße Werkzeugzeile */
header{background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-direction:column;box-shadow:var(--shadow);position:relative;z-index:5}
.appbar{background:var(--head);color:#fff;height:52px;padding:0 20px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.appbar .brand{font-weight:600;font-size:15px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.appbar .brand .hex{font-size:17px;opacity:.9}
.appbar .brand small{font-weight:400;font-size:12px;opacity:.75}
.hbadge{font:500 11px/1 var(--mono);background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:4px;padding:5px 9px;color:#fff;box-shadow:none}
button.hbadge:hover{background:rgba(255,255,255,.26);color:#fff;border-color:rgba(255,255,255,.5)}
.hbadge.help{font-family:var(--sans);font-size:12px;padding:4px 10px}
.hbadge.help b{display:inline-block;width:16px;height:16px;line-height:16px;border-radius:50%;background:#fff;color:var(--head);text-align:center;font-size:11px;margin-right:4px}
.appbar .folder{font:12px var(--mono);color:rgba(255,255,255,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 20px}
.upd{font-size:12px;padding:4px 10px;background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.upd:hover{color:#fff;background:var(--ok);filter:brightness(1.1)}
.folder{font-family:var(--mono);font-size:13px;color:var(--muted)}

/* Firmensymbol als dezentes Wasserzeichen (wie in LabelKit) – hinter allen Inhalten, nicht im Ausdruck */
#wasserzeichen{position:fixed;inset:0;z-index:-1;pointer-events:none;display:flex;align-items:center;justify-content:center;opacity:.07}
#wasserzeichen img{width:min(64vmin,640px);height:auto}
@media (prefers-color-scheme: dark){ #wasserzeichen{opacity:.09} }
@media print{ #wasserzeichen{display:none!important} }
@media (max-width:680px){ #wasserzeichen img{width:84vmin} }
.spacer{flex:1}
#q{width:240px}
.years{display:flex;gap:4px;flex-wrap:wrap}
.years button{padding:3px 9px;font-size:12.5px;border-radius:12px}
.years button.on{background:var(--primary);border-color:var(--primary);color:var(--on-accent)}

#banner{display:none;padding:8px 16px;font-size:13px;border-bottom:1px solid var(--line);align-items:center;gap:10px;flex-wrap:wrap}
#banner.show{display:flex}
#banner.info{background:var(--panel2)}
#banner.ok{background:color-mix(in srgb,var(--ok) 12%,var(--panel))}
#banner.err{background:color-mix(in srgb,var(--err) 12%,var(--panel))}

main{flex:1;display:flex;min-height:0}
#listWrap{flex:1 1 52%;overflow:auto;padding:10px 12px 40px}
#detail{flex:1 1 48%;border-left:1px solid var(--line);background:color-mix(in srgb,var(--panel) 62%,transparent);overflow:auto;padding:16px 20px 40px;min-width:0}

.empty{max-width:560px;margin:60px auto;text-align:center;color:var(--muted)}
.empty h2{color:var(--text);font-size:18px;margin:0 0 8px}
.empty p{margin:6px 0 16px}
.empty code{font-family:var(--mono);background:var(--panel2);border:1px solid var(--line);padding:1px 6px;border-radius:4px;color:var(--text)}

.count{font-size:12.5px;color:var(--muted);margin:2px 4px 8px}
.proj{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:8px 10px;margin-bottom:6px;cursor:pointer}
.proj:hover{border-color:var(--accent-l)}
.proj.active{background:var(--focus);border-color:var(--accent)}
.proj .nr{font:600 13px var(--mono)}
.proj .ort{min-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj .ort small{color:var(--muted);margin-left:6px}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:11.5px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.yes{border-color:color-mix(in srgb,var(--ok) 55%,var(--line));color:var(--ok)}
.chip.miss{border-style:dashed}
.chip.wait{opacity:.5}
.group{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:16px 4px 6px}

#detail h2{margin:0;font-size:20px}
#detail h2 .nr{font-family:var(--mono);color:var(--accent)}
#detail .sub{color:var(--muted);font-size:13px;margin:2px 0 14px}
#detail h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:22px 0 8px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .hint{font-size:12px;color:var(--muted);flex-basis:100%}
/* ---------- Projektansicht (rechts), geführt: Kopf · Projektdaten · Arbeitsschritte · Ordner ----------
   Eine Spalte, in der Reihenfolge der Arbeit. Farbe = App (wie ihr Symbol), gefüllt = nächster Schritt, Haken = erledigt.
   Alles Weitere (Projektdaten, Ordnerstand) ist zugeklappt und öffnet sich auf Klick. */
#detail .pz{max-width:660px}
#detail .pz .sub{margin-bottom:16px}
.steps{display:flex;flex-direction:column;gap:12px;margin:18px 0 6px}
.steps .sw{--ac:var(--accent);position:relative}
.steps .sw[data-app=label]{--ac:#5469b8}
.steps .sw[data-app=fotos]{--ac:#2f87a6}
.steps .sw[data-app=plan]{--ac:#4179b2}
.steps .sw[data-app=beleg]{--ac:#2f7d6d}
.steps .step{position:relative;z-index:1;display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 16px 10px 14px;text-align:left;
  background:var(--panel);border:1px solid var(--line2);border-left:5px solid var(--ac);border-radius:10px;color:var(--text);font-weight:400;box-shadow:none}
.steps .step:hover{border-color:var(--ac);border-left-color:var(--ac);color:var(--text);box-shadow:0 2px 10px color-mix(in srgb,var(--ac) 22%,transparent)}
.steps .step .n{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:700;color:var(--ac);background:color-mix(in srgb,var(--ac) 13%,var(--panel));border:2px solid var(--ac)}
.steps .step .name{display:block;font-size:17px;font-weight:700;line-height:1.2}
.steps .step small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.steps .step .stat{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
/* Verbindungslinie hinter den Karten (läuft auch neben einer angehängten Anlage weiter) */
.steps .sw:not(:last-child)::after{content:"";position:absolute;left:38px;top:32px;bottom:-12px;width:2px;background:var(--line2)}
.steps .sw.done:not(:last-child)::after{background:var(--ok)}
.steps .sw:nth-last-child(2)::after{bottom:0}
/* erledigt: ruhig, mit Haken */
.steps .sw.done .step{background:color-mix(in srgb,var(--ok) 5%,var(--panel))}
.steps .sw.done .step .n{background:var(--ok);border-color:var(--ok);color:#fff}
.steps .sw.done .step .stat{color:var(--ok);font-weight:600}
/* nächster Schritt: gefüllt in der Farbe der App */
.steps .sw.next .step{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 3px 12px color-mix(in srgb,var(--ac) 38%,transparent)}
.steps .sw.next .step small,.steps .sw.next .step .stat{color:rgba(255,255,255,.86)}
.steps .sw.next .step .n{background:#fff;color:var(--ac);border-color:#fff}
.steps .sw.next .step:hover{color:#fff;filter:brightness(1.07)}
/* Abschluss (BelegKit): abgesetzt und leichter, gestrichelt angebunden */
.steps .sw.last{margin-top:10px}
.steps .sw.last .step{min-height:56px;border-style:dashed;border-left-style:solid}
.steps .sw.last::before{content:"";position:absolute;left:38px;bottom:100%;height:22px;border-left:2px dashed var(--line2)}
/* Anlage am Schritt: klein, eingerückt, in der Farbe der App */
.att{position:relative;z-index:1;margin:6px 0 0 54px;padding:8px 12px;border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:8px;background:var(--panel2);font-size:13px}
.att:empty{display:none}
.att .row{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap}
.att .row b{font-weight:600}
.att .row .m{color:var(--muted)}
.att .row button{margin-left:auto}
.att .klein{font-size:12px;color:var(--muted);margin-top:3px}
.att .warn{font-size:12.5px;margin-top:4px}
/* aufklappbare Karten: Projektdaten, Ordner */
.card{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.card > summary{list-style:none;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:11px 14px;cursor:pointer;border-radius:10px}
.card > summary::-webkit-details-marker{display:none}
.card > summary::before{content:"▸";color:var(--muted);transition:transform .12s;display:inline-block;width:10px}
.card[open] > summary::before{transform:rotate(90deg)}
.card > summary:hover{background:var(--panel2)}
.card > summary .t{font-weight:600}
.card > summary .sum{color:var(--muted);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card[open] > summary .sum{visibility:hidden}
.card[open] > summary{border-bottom:1px solid var(--line);border-radius:10px 10px 0 0}
.card .body{padding:12px 14px 14px}
.card > summary .save{margin:0;min-height:0;margin-left:auto}
/* noch keine Projektdaten: Karte lädt zum Ausfüllen ein (gestrichelt, Akzentfarbe) – ohne die Arbeitsschritte zu verdrängen */
.card.leer{border:1px dashed var(--accent-l);background:color-mix(in srgb,var(--accent) 5%,var(--panel))}
.card.leer > summary .sum{color:var(--accent)}
.form .grp{grid-column:1 / -1;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:6px}
.form .grp:first-child{margin-top:0}
.warnbar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-top:14px;padding:9px 12px;border:1px dashed color-mix(in srgb,var(--warn) 55%,var(--line));border-radius:8px;
  background:color-mix(in srgb,var(--warn) 7%,var(--panel));color:var(--warn);font-size:13px}
.warnbar button{margin-left:auto}
@media (prefers-color-scheme:dark){
  .steps .sw[data-app=label]{--ac:#8b9cdd} .steps .sw[data-app=fotos]{--ac:#5bb6d2} .steps .sw[data-app=plan]{--ac:#6fa3dc} .steps .sw[data-app=beleg]{--ac:#5fbfa9}
  .steps .sw.next .step,.steps .sw.next .step:hover{color:#0f1720} .steps .sw.next .step small,.steps .sw.next .step .stat{color:rgba(15,23,32,.78)}
  .steps .sw.next .step .n{background:#0f1720;color:var(--ac);border-color:#0f1720}
}
table.folders{width:100%;border-collapse:collapse;font-size:13px}
table.folders td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.folders td:first-child{font-weight:600;white-space:nowrap;width:150px}
table.folders .m{color:var(--muted)}
table.folders .ok{color:var(--ok)}
table.folders .miss{color:var(--warn)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.form label.wide{grid-column:1 / -1}
.form input,.form textarea{color:var(--text)}
.save{font-size:12.5px;color:var(--muted);margin-top:8px;min-height:18px}
.save.err{color:var(--err)}
.save.ok{color:var(--ok)}
.warn{color:var(--warn)}
/* Arbeitszettel einlesen */
.azrow{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;margin-bottom:12px}
.azrow .m{font-size:12.5px;color:var(--muted)}
.card.drop{outline:2px dashed var(--accent);outline-offset:2px}
.dialog.az{width:min(820px,96vw)}
.dialog .aztab{overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.dialog .aztab td{padding:5px 10px 5px 0;border-bottom:1px solid var(--line)}
.dialog .aztab tr:last-child td{border-bottom:0}
.dialog .aztab td:first-child{width:20px}
.dialog .aztab td.v{color:var(--text);white-space:normal}
.dialog .aztab td.st{font-size:12px;color:var(--muted);white-space:normal;max-width:220px}
.dialog .aztab td.st.warn{color:var(--warn)}
.dialog .azwarn{padding:8px 12px;border:1px solid var(--err);border-radius:8px;color:var(--err);font-size:13px;display:flex;flex-direction:column;gap:6px}
.dialog .azwarn label{color:var(--text)}
/* Verteiler */
table.vt{width:100%;border-collapse:collapse;font-size:13px}
table.vt td{padding:5px 8px 5px 0;border-bottom:1px solid var(--line);vertical-align:middle}
table.vt tr:last-child td{border-bottom:0}
table.vt td:first-child{white-space:nowrap;width:170px}
table.vt td.m{color:var(--muted)}
table.vt td:last-child{white-space:nowrap;text-align:right}
table.vt .vtD{font-size:12px;color:var(--muted);white-space:nowrap}
table.vt button{padding:2px 8px;font-size:12px;margin-left:6px}
.vtHint{font-size:12.5px;color:var(--muted);margin-bottom:6px}

#dlgBack{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:50}
#dlgBack.show{display:flex}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;width:min(640px,94vw);max-height:90vh;display:flex;flex-direction:column;gap:12px}
.dialog h3{margin:0}
.dialog.help{width:min(900px,96vw)}
.help-body{overflow:auto;color:var(--text);font-size:14px;line-height:1.55;padding-right:6px}
.help-body h4{margin:18px 0 6px;font-size:15px}
.help-body p,.help-body li{margin:4px 0}
.help-body ol,.help-body ul{padding-left:22px;margin:4px 0}
.help-body svg{width:100%;height:auto;margin:6px 0 2px;display:block}
.help-body .cap{font-size:12px;color:var(--muted);margin-bottom:6px}
.help-body table{border-collapse:collapse;width:100%}
.help-body table td{padding:4px 12px 4px 0;font-size:13px;color:var(--text)}
.help-body table td:first-child{white-space:nowrap;font-weight:600;color:var(--text)}
.help-body code{font-family:var(--mono);font-size:12.5px}
.help-link{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline}
.dialog .btns{display:flex;gap:8px;justify-content:flex-end}
.dialog table td{padding:3px 12px 3px 0;vertical-align:top;font-size:13px}
.dialog table td:first-child{color:var(--muted);white-space:nowrap}
.dialog .m{font-size:13px;color:var(--muted);overflow:auto}
#support{display:none;background:color-mix(in srgb,var(--err) 12%,var(--panel));padding:10px 16px;border-bottom:1px solid var(--line)}
@media (max-width:860px){ main{flex-direction:column} #detail{border-left:0;border-top:1px solid var(--line)} .form{grid-template-columns:1fr} }
</style>
</head>

<script>
'use strict';
/* =====================================================================================================
   DOCX – kleiner Word-Schreiber (Office Open XML) für die Anlagen zum Gutachten. Ohne Bibliotheken, ohne Netz.
   Gedacht zum Einfügen in den Bericht mit Word „Einfügen › Objekt › Text aus Datei“. Deshalb:
     • nur direkte Formatierung (Arial, Größen, Abstände) – keine Formatvorlagen, die beim Einfügen von den
       Vorlagen des Berichts überschrieben würden;
     • keine Kopf- und Fußzeilen (die kommen aus dem Bericht), Seitenformat wie im Bericht (A4, Ränder 25 mm);
     • echter Text und echte Tabellen, keine Bilder von Text.
   Bausteine (blocks):
     {t:'p', text|runs, align, size, b, i, u, before, after, line, keepNext, pageBreakBefore, mono}
     {t:'table', widths:[twips…], rows:[{header, cells:[{image?, text|runs|paras, span, shade, align, b, size}]}], size}
   Gleiche Fassung als src/docx.ts in PlanKit (Anlage Probenahme) – Änderungen in beiden Apps gleich halten.
     {t:'image', data:Uint8Array, ext:'png'|'jpeg', widthMm, heightMm, alt, align}
     {t:'pagebreak'}
   DOCX.build({title, author, created, blocks}) → Uint8Array (ZIP, unkomprimiert gespeichert; Word liest das).
   Der Teil zwischen DOCX-START und DOCX-ENDE läuft auch in Node (tests/docx.cjs).                     */
/* DOCX-START */
const DOCX = (() => {
  const PAGE = { w: 11906, h: 16838, top: 1418, bottom: 1134, left: 1418, right: 1418 };   // A4, Ränder wie Bericht (25 mm seitlich)
  const TEXT_W = PAGE.w - PAGE.left - PAGE.right;                                             // 9070 twips nutzbare Breite
  const FONT = 'Arial';
  const enc = new TextEncoder();
  // XML: Sonderzeichen maskieren und in XML 1.0 unzulässige Steuerzeichen entfernen (würden Word „beschädigt“ melden lassen)
  const ohneEinzelSurrogate = s => { let o = ''; for (let i = 0; i < s.length; i++){ const c = s.charCodeAt(i);
    if (c >= 0xD800 && c <= 0xDBFF){ const d = s.charCodeAt(i + 1); if (d >= 0xDC00 && d <= 0xDFFF){ o += s[i] + s[i + 1]; i++; } continue; }
    if (c >= 0xDC00 && c <= 0xDFFF) continue; o += s[i]; } return o; };
  const x = s => ohneEinzelSurrogate(String(s == null ? '' : s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFE\uFFFF]/g, ''))
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  function rPr(o){
    const f = o.mono ? 'Courier New' : (o.font || FONT), sz = Math.round((o.size || 11) * 2);
    return `<w:rPr><w:rFonts w:ascii="${f}" w:hAnsi="${f}" w:cs="${f}" w:eastAsia="${f}"/>${o.b ? '<w:b/><w:bCs/>' : ''}${o.i ? '<w:i/><w:iCs/>' : ''}${o.u ? '<w:u w:val="single"/>' : ''}${o.color ? `<w:color w:val="${o.color}"/>` : ''}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/><w:lang w:val="de-DE"/></w:rPr>`;
  }
  // Ein Lauf; Zeilenumbrüche → <w:br/>, Tabs → <w:tab/>
  function run(r, base){
    const o = Object.assign({}, base, r);
    const parts = String(o.text == null ? '' : o.text).split(/(\n|\t)/);
    let inner = '';
    for (const p of parts){
      if (p === '\n') inner += '<w:br/>';
      else if (p === '\t') inner += '<w:tab/>';
      else if (p) inner += `<w:t xml:space="preserve">${x(p)}</w:t>`;
    }
    return `<w:r>${rPr(o)}${inner}</w:r>`;
  }
  function runsOf(o){ return o.runs || [{ text: o.text == null ? '' : o.text }]; }
  function pPr(o, inCell){
    const jc = { left: 'left', center: 'center', right: 'right', both: 'both' }[o.align || 'left'];
    const line = o.line || (inCell ? 240 : 240);
    return `<w:pPr>${o.keepNext ? '<w:keepNext/>' : ''}${o.keepLines ? '<w:keepLines/>' : ''}${o.pageBreakBefore ? '<w:pageBreakBefore/>' : ''}`
      + `<w:spacing w:before="${o.before || 0}" w:after="${o.after == null ? (inCell ? 0 : 120) : o.after}" w:line="${line}" w:lineRule="auto"/>`
      + (o.indent ? `<w:ind w:left="${o.indent}"/>` : '') + `<w:jc w:val="${jc}"/>${rPr(o)}</w:pPr>`;
  }
  function para(o, inCell){
    const base = { size: o.size, b: o.b, i: o.i, u: o.u, mono: o.mono, font: o.font, color: o.color };
    return `<w:p>${pPr(o, inCell)}${runsOf(o).map(r => run(r, base)).join('')}</w:p>`;
  }
  function table(o, ctx){
    const widths = o.widths, total = widths.reduce((a, b) => a + b, 0), size = o.size || 10;
    const bd = v => `<w:top w:val="${v}" w:sz="4" w:space="0" w:color="000000"/><w:left w:val="${v}" w:sz="4" w:space="0" w:color="000000"/><w:bottom w:val="${v}" w:sz="4" w:space="0" w:color="000000"/><w:right w:val="${v}" w:sz="4" w:space="0" w:color="000000"/>`;
    const border = o.borders === false ? 'nil' : 'single';
    let xml = `<w:tbl><w:tblPr><w:tblW w:w="${total}" w:type="dxa"/>${o.align === 'center' ? '<w:jc w:val="center"/>' : ''}<w:tblLayout w:type="fixed"/>`
      + `<w:tblBorders>${bd(border)}<w:insideH w:val="${border}" w:sz="4" w:space="0" w:color="000000"/><w:insideV w:val="${border}" w:sz="4" w:space="0" w:color="000000"/></w:tblBorders>`
      + `<w:tblCellMar><w:top w:w="40" w:type="dxa"/><w:left w:w="80" w:type="dxa"/><w:bottom w:w="40" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar>`

      dual('Witterung:', kw('witterung'), 'Transport kühl und dunkel:', jn(k.kuehl)),
      dual('Gerät:', mit(kw('geraet'), kw('geraetSonstiges')), 'Gefäß:', mit(kw('gefaess'), kw('gefaessSonstiges'))),
      voll('Lage der Probenahmestellen:', kw('lage')),
    ];
    (rec.mp || []).forEach((m, j) => {
      const mw = key => w(`mp.${j}.${key}`, (m.w || {})[key]);
      const ep = mw('einzelproben');
      const art = mw('art') === 'Mischprobe' ? 'Mischprobe' + (ep ? ` aus ${ep} Einzelproben` : '') : (mw('art') || (ep ? `${ep} Einzelproben` : ''));
      rows.push({ cells: [{ text: `Probe ${m.nr}` + (mw('probenNr') ? ` · Proben-Nr. ${mw('probenNr')}` : ' · ohne Proben-Nr.'), b: true, shade: 'D9D9D9', span: 4 }] });
      rows.push(dual('Uhrzeit:', mw('uhrzeit'), 'Foto-Nr.:', mw('foto')));
      rows.push(voll('Entnahmestelle:', mw('stelle')));
      rows.push(voll('Material / Art der Probe:', mw('material')));
      rows.push(dual('Probenart:', art, 'Menge vor Ort / Laborprobe:', [mw('volumen') && `ca. ${mw('volumen')} m³`, mw('menge') && `ca. ${mw('menge')} kg`].filter(Boolean).join(' / ')));
      rows.push(dual('Farbe:', mw('farbe'), 'Geruch:', mw('geruch') === 'anders' ? mit('anders', mw('geruchAnders')) : mit(mw('geruch'), mw('geruchAnders'))));
      rows.push(dual('Konsistenz:', mw('konsistenz'), 'Feuchte:', mw('feuchte')));
      rows.push(voll('Bemerkung:', mw('anmerkung')));
    });
    rows.push({ cells: [{ text: 'Unterschriften auf dem Bogen', b: true, shade: 'D9D9D9', span: 4 }] });
    rows.push(dual('Probenehmer:', k.unterschrift ? 'vorhanden' : 'nicht bestätigt', 'Anwesende / Zeugen:', k.zeugen ? 'vorhanden' : '—'));
    if (kw('ortDatum')) rows.push(voll('Ort, Datum (lt. Bogen):', kw('ortDatum')));

    const status = !rec.abgeschlossen ? 'in Erfassung (nicht abgeschlossen)'
      : `abgeschlossen von ${t(rec.abgeschlossen.von)} am ${zeit(rec.abgeschlossen.am)}; `
        + (rec.pruefung ? `Übertragung geprüft von ${t(rec.pruefung.von)} am ${zeit(rec.pruefung.am)}${rec.pruefung.selbst ? ' (durch die erfassende Person)' : ''}` : 'Übertragung nicht durch eine zweite Person geprüft');
    const ae = Array.isArray(rec.aenderungen) ? rec.aenderungen : [];
    const blocks = [
      P('Probenahmeprotokoll Feststoffe', { b: true, size: 12, align: 'center', after: 40, keepNext: true, pageBreakBefore: !ersteSeite }),
      P(`in Anlehnung an LAGA PN 98 · Übertragung des Feldbogens ${t(rec.formularId)} · Feldprotokoll ${i + 1} von ${n}`, { size: 10, align: 'center', after: 160, keepNext: true }),
      { t: 'table', widths: q, rows, size: 10 },
      P('Übertragung', { b: true, size: 10, before: 160, after: 40, keepNext: true }),
      P(`Vom handschriftlich ausgefüllten Feldbogen am Schreibtisch übertragen: erfasst von ${t(rec.erfasstVon) || '—'} ab ${zeit(rec.erfasstAm)}; ${status}. `
        + 'Werte wie auf dem Bogen; nicht ausgefüllte Felder bleiben leer; „[unleserlich]“ ist auf dem Bogen nicht sicher lesbar. Maßgeblich ist der Papierbogen bzw. sein Scan.', { size: 9, after: 60 }),

    if (ae.length){
      blocks.push(P(`Änderungen nach Abschluss der Erfassung (${ae.length})`, { b: true, size: 10, before: 100, after: 40, keepNext: true }));

        { header: true, cells: ['Zeit', 'Kürzel', 'Feld', 'alt', 'neu'].map(h => ({ text: h, b: true, shade: 'F2F2F2' })) },

    }
    const sc = scans || [];
    blocks.push(P('Scan des Feldbogens', { b: true, size: 10, before: 100, after: 40, keepNext: true }));
    if (!sc.length) blocks.push(P('Kein Scan abgelegt.', { size: 9, after: 60 }));
    const ST = { ok: 'Prüfsumme beim Erstellen der Anlage bestätigt', abweichend: 'ACHTUNG: Datei weicht von der abgelegten Prüfsumme ab', fehlt: 'Datei im Projektordner nicht gefunden', ungeprueft: 'Prüfsumme nicht nachgeprüft' };
    sc.forEach(x => {
      blocks.push(P(`Feldprotokolle/${str(x.datei)} · abgelegt ${zeit(x.abgelegtAm)}${x.abgelegtVon ? ' von ' + str(x.abgelegtVon) : ''}`
        + (x.ungueltig ? ` · als ungültig vermerkt${x.ungueltig.grund ? ': ' + str(x.ungueltig.grund) : ''}` : ` · ${ST[x.status] || ST.ungeprueft}`), { size: 9, after: 0, keepNext: true }));
      blocks.push(P(`SHA-256 ${str(x.sha256)}`, { size: 8, mono: true, color: '595959', after: 60 }));
    });
    sc.filter(x => !x.ungueltig && x.bild).forEach((x, j) => {
      const b = x.bild, s = Math.min(160 / b.widthPx, 215 / b.heightPx);
      blocks.push(P(`Scan des Feldbogens ${t(rec.formularId)}${sc.filter(y => !y.ungueltig && y.bild).length > 1 ? ` (${j + 1})` : ''} – verkleinerte Wiedergabe; maßgeblich ist die Datei mit der oben genannten Prüfsumme`, { size: 9, align: 'center', after: 60, keepNext: true, pageBreakBefore: true }));
      blocks.push({ t: 'image', data: b.data, ext: b.ext, widthMm: b.widthPx * s, heightMm: b.heightPx * s, alt: 'Scan ' + str(x.datei), after: 0 });
    });
    return blocks;
  }

  function brandTabelle(daten){
    const brand = daten.brandgeruchProben || [];
    const w = [600, 3020, 1090, 1090, 1090, 1090, 1090];
    const head = { header: true, cells: [{ text: 'Nr.', b: true, align: 'center', shade: 'F2F2F2' }, { text: 'Probe', b: true, shade: 'F2F2F2' },
      ...BG_KEYS.map((k, j) => ({ text: 'Person ' + (j + 1), b: true, align: 'center', shade: 'F2F2F2' }))] };
    const rows = brand.map((p, i) => ({ cells: [
      { text: String(i + 1), align: 'center' },
      { text: [t(p.z1), t(p.z2)].filter(Boolean).join('\n') },
      ...BG_KEYS.map(k => ({ text: str(p[k]), align: 'center', b: true, vAlign: 'center' }))] }));
    return { t: 'table', widths: w, rows: [head, ...rows], size: 10 };
  }

  function quellenvermerk(o){
    const q = o.quelle || {};
    const zeilen = [
      `Quellenvermerk: Erstellt am ${zeit(o.erstellt)} mit ${o.anwendung || 'Projektzentrale'} aus der Projektdatei „${q.pfad || q.datei || ''}“`
        + (q.geaendert ? ` (Stand ${zeit(q.geaendert)}${q.version ? ', LabelKit ' + q.version : ''})` : '') + '.',
      'Die Angaben sind unverändert aus der Projektdatei übernommen; nicht ausgefüllte Felder bleiben leer.',
      `SHA-256 der Projektdatei: ${q.sha256 || ''}`,
    ];
    return [P(zeilen[0], { size: 8, color: '595959', before: 240, after: 0, keepLines: true }), P(zeilen[1], { size: 8, color: '595959', after: 0 }), P(zeilen[2], { size: 8, color: '595959', mono: true, after: 0 })];
  }

  /** Anlage „Probenahmeprotokolle PN 98 / Brandgeruch“: Bausteine für DOCX.build. */
  function pn98Brand(daten, o){
    const d = daten || {}, chk = pruefen(d, o.projektNr);
    const mitPn98 = o.pn98 !== false && chk.pn98Moeglich, mitBrand = o.brand !== false && chk.brandMoeglich;
    if (!mitPn98 && !mitBrand) throw new Error('Keine Inhalte für die Anlage (keine PN 98-Protokolle bzw. Brandgeruch-Bewertungen verdeckt oder leer).');
    const titel = t(o.titel) || 'Anlage';
    const teile = [mitPn98 && 'Probenahmeprotokolle nach LAGA PN 98', mitBrand && 'Sensorische Prüfung auf Brandgeruch'].filter(Boolean);
    const blocks = [
      P(`${titel}: ${teile.join(' und ')}`, { size: 12, u: true, after: 60, keepNext: true }),
      P(`Projekt ${t(o.projektNr)}${t(o.ort) ? ' · ' + t(o.ort) : ''}`, { size: 11, after: 240, keepNext: true }),
    ];
    if (mitPn98){
      const feld = feldPn98(d), proj = d.pn98Projekt || {}, list = Array.isArray(d.pn98Proben) ? d.pn98Proben : [];
      feld.forEach((r, i) => blocks.push(...pn98Feldblatt(r, i, feld.length, i === 0, (o.scans || {})[r.id] || (r.scans || []).map(x => Object.assign({ status: 'ungeprueft' }, x)))));
      list.forEach((p, i) => blocks.push(...pn98Blatt(p, proj, i, list.length, i === 0 && !feld.length)));
    }
    if (mitBrand){
      blocks.push(P('Sensorische Prüfung auf Brandgeruch', { size: 12, b: true, after: 40, keepNext: true, pageBreakBefore: mitPn98 }));
      blocks.push(P(['Projekt ' + t(o.projektNr), d.brandgeruchDatum ? 'Prüfung am ' + datum(d.brandgeruchDatum) : ''].filter(Boolean).join(' · '), { size: 11, after: 160, keepNext: true }));
      blocks.push(brandTabelle(d));
      blocks.push(P('Legende: ++ stark · + mittel · (+) schwach · - ohne. Bewertungen je Person unverändert wiedergegeben.', { size: 10, before: 60, after: 0 }));
    }
    blocks.push(...quellenvermerk(o));
    return { blocks, teile, pruefung: chk, mitPn98, mitBrand };
  }

  /** Dateiname: ERVV-tauglich (Buchstaben, Ziffern, _ und -, ein Punkt, ≤ 90 Zeichen), datiert, nie überschreibend. */
  function dateiname(projektNr, titel, art, datumIso, vorhanden){
    const s = v => String(v || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss').replace(/[^A-Za-z0-9_-]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
    const basis = [s(projektNr) || 'Projekt', s(titel) || 'Anlage', s(art)].filter(Boolean).join('_').slice(0, 64) + '_' + String(datumIso).slice(0, 10);
    const belegt = new Set([...(vorhanden || [])].map(n => String(n).toLowerCase()));
    for (let i = 1; i < 1000; i++){ const n = basis + (i > 1 ? '_' + i : '') + '.docx'; if (!belegt.has(n.toLowerCase())) return n; }
    throw new Error('Zu viele Anlagen mit gleichem Namen');
  }
  return { pruefen, pn98Brand, dateiname, datum, zeit, feldPn98 };
})();

const verNum = v => String(v || '0').split('.').map(x => parseInt(x, 10) || 0);

const deDate = iso => { const m = (iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${m[3]}.${m[2]}.${m[1]}` : (iso || ''); };

/* ---------- suite store ----------
   All apps under kaspersebastian83-dot.github.io share one origin and therefore one IndexedDB. The database
   „mosaik-suite“ holds the handle of the archive folder, so FotoKit and PlanKit can open a project
   without asking for the folder again. Contract (keep identical in every app):
     DB „mosaik-suite“, version 1, object store „kv“
     key „archiv“ → FileSystemDirectoryHandle of „Mosaik Archivordner“
     key „zuletzt“ → Array der zuletzt geöffneten Projektnamen (neuester zuerst, höchstens 6; führt die Mosaik-Leiste der Apps) */
const SUITE = {
  db: null,
  open(){
    return this.db || (this.db = new Promise((res, rej) => {
      const r = indexedDB.open('mosaik-suite', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
  },
  async get(k){
    const db = await this.open();
    return new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  },
  async set(k, v){
    const db = await this.open();
    return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); });

async function readPJ(dir){
  try{
    const f = await (await dir.getFileHandle(PJ_FILE)).getFile();
    const txt = await f.text();
    if (!txt.trim()) return { data: {}, exists: true };
    const o = JSON.parse(txt);
    if (o && o.format === 'mosaik-projekt' && o.version > 1) return { data: o, exists: true, newer: true };
    return { data: o && typeof o === 'object' ? o : {}, exists: true };
  }catch(e){
    if (e.name === 'NotFoundError') return { data: {}, exists: false };
    return { data: {}, exists: true, error: e.message };
  }
}
/* Gemeinsame Regeln für _Projekt.json (in Projektzentrale und FotoKit identisch halten): eine Sperre je Projekt, ein Hinweistext. */
const PJ_HINWEIS = 'Gemeinsame Projektdaten (Projektzentrale, FotoKit, PlanKit, LabelKit). Bitte nicht löschen oder umbenennen.';
function mitPjSperre(name, fn){ return navigator.locks ? navigator.locks.request('mosaik:projekt:' + name, fn) : fn(); }
function patchPJ(dir, name, patch){
  /* Lesen → ändern → Schreiben unter einer Sperre je Projekt: FotoKit (anderer Tab) schreibt dieselbe Datei und nimmt dieselbe Sperre. */
  return mitPjSperre(name, async () => {
    const cur = await readPJ(dir);
    if (cur.error) throw new Error(`„${PJ_FILE}“ ist nicht lesbar (${cur.error}) und wird nicht überschrieben.`);
    if (cur.newer) throw new Error(`„${PJ_FILE}“ stammt von einer neueren Version – bitte Projektzentrale aktualisieren.`);
    const p = parseProjName(name) || {};
    const o = Object.assign({}, cur.data, patch, {
      format: 'mosaik-projekt', version: 1, hinweis: PJ_HINWEIS,
      projektnummer: p.nr || cur.data.projektnummer || '', schadenort: p.ort || cur.data.schadenort || '',
      geaendert: new Date().toISOString(), geaendertMit: 'Projektzentrale ' + APP_VERSION
    });
    const order = ['format', 'version', 'hinweis', 'projektnummer', 'schadenort', ...PJ_FIELDS.map(f => f[0]), 'geaendert', 'geaendertMit'];
    const sorted = {};
    for (const k of order) if (k in o) sorted[k] = o[k];
    for (const k of Object.keys(o)) if (!(k in sorted)) sorted[k] = o[k];   // unknown fields from other apps stay
    const fh = await dir.getFileHandle(PJ_FILE, { create: true });
    const w = await fh.createWritable(); await w.write(JSON.stringify(sorted, null, 2) + '\n'); await w.close();
    return sorted;
  });
}

/* ---------- state ---------- */
const S = { archive: null, projects: [], others: [], sel: null, year: '', q: '', scanToken: 0, pj: null, pjDirty: {}, pjTimer: null, pjWriting: Promise.resolve() };

/* ---------- archive folder ---------- */
const supported = 'showDirectoryPicker' in window;
if (!supported){ $('support').style.display = 'block'; $('btnArchive').disabled = true; }

async function pickArchive(){
  let dir;
  try{ dir = await window.showDirectoryPicker({ mode: 'readwrite', id: 'mosaik-archiv' }); }
  catch(e){ if (e.name !== 'AbortError') banner('err', 'Ordner konnte nicht geöffnet werden: ' + esc(e.message)); return; }
  const p = parseProjName(dir.name);
  if (p || SUBS.some(s => norm(s[1]) === norm(dir.name))){
    banner('err', `„${esc(dir.name)}“ ist ein Projekt- bzw. Unterordner. Bitte den übergeordneten Ordner wählen, in dem alle Projekte liegen (z. B. <code>C:\\daten\\Mosaik Archivordner</code>).`);
    return;
  }
  await SUITE.set('archiv', dir).catch(() => {});
  await useArchive(dir);
}
async function restoreArchive(){
  if (!supported) return;
  let dir = null;
  try{ dir = await SUITE.get('archiv'); }catch(e){}
  if (!dir){ showStart(); return; }
  const st = await dir.queryPermission({ mode: 'readwrite' }).catch(() => 'denied');
  if (st === 'granted'){ await useArchive(dir); return; }
  showStart(dir);
}
function showStart(dir){
  $('list').innerHTML = dir
    ? `<div class="empty"><h2>Zugriff erneut erlauben</h2>
         <p>Der Browser fragt nach jedem Neustart einmal nach, ob die Projektzentrale auf <code>${esc(dir.name)}</code> zugreifen darf.</p>
         <button class="primary" id="btnGrant">Zugriff auf „${esc(dir.name)}“ erlauben</button>
         <p><small>Anderer Ordner? Oben „Archivordner wählen …“.</small></p></div>`
    : `<div class="empty"><h2>Archivordner wählen</h2>
         <p>Einmal den Ordner wählen, in dem alle Projektordner liegen – im Büro <code>C:\\daten\\Mosaik Archivordner</code>. Der Browser merkt sich die Auswahl.</p>
         <button class="primary" id="btnStart">Archivordner wählen …</button>
         <p><small>Nichts wird hochgeladen – die App arbeitet nur im Browser auf diesem Rechner.</small></p>
         <p><button class="help-link" data-help>Kurzanleitung: so arbeiten Projektzentrale, LabelKit, FotoKit und PlanKit zusammen</button></p></div>`;
  if (dir) $('btnGrant').onclick = async () => {
    const st = await dir.requestPermission({ mode: 'readwrite' }).catch(() => 'denied');
    if (st === 'granted') await useArchive(dir); else banner('err', 'Ohne Zugriff kann die Projektzentrale die Projekte nicht anzeigen.');
  };
  else $('btnStart').onclick = pickArchive;
}

async function useArchive(dir){
  S.archive = dir; S.sel = null;
  $('archiveName').textContent = '📁 ' + dir.name;
  $('btnRescan').disabled = false; $('q').disabled = false;
  await listProjects();
}

/* ---------- scanning ---------- */
async function listProjects(){
  const token = ++S.scanToken;
  banner('info', 'Lese Projektordner …');
  const projects = [], others = [];
  try{
    for await (const h of S.archive.values()){
      if (h.kind !== 'directory') continue;
      const p = parseProjName(h.name);
      if (p) projects.push({ handle: h, name: h.name, ...p, st: null });
      else if (!h.name.startsWith('.') && !h.name.startsWith('~')) others.push({ handle: h, name: h.name });
    }
  }catch(e){ banner('err', 'Archivordner nicht lesbar: ' + esc(e.message)); return; }
  if (token !== S.scanToken) return;
  projects.sort((a, b) => b.key - a.key || a.name.localeCompare(b.name, 'de'));
  others.sort((a, b) => a.name.localeCompare(b.name, 'de', { numeric: true }));
  S.projects = projects; S.others = others;
  hideBanner();
  renderYears(); renderList();
  if (S.sel){ const again = projects.find(p => p.name === S.sel.name); if (again) selectProject(again); }
  else{
    /* Beim Start das zuletzt in einer App geöffnete Projekt vorwählen (Liste „zuletzt“ in „mosaik-suite“, von den Apps geführt) */
    let z = null; try{ z = await SUITE.get('zuletzt'); }catch(e){}
    const last = Array.isArray(z) && projects.find(p => p.name.normalize('NFC') === String(z[0] || '').normalize('NFC'));
    if (last && token === S.scanToken && !S.sel){ await selectProject(last); const el = [...$('list').querySelectorAll('.proj')].find(e => e.dataset.name === last.name); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' }); }
  }
  scanAll(token);
}
async function scanProject(p){
  const st = { subs: {}, extra: [], pj: false, err: '' };
  try{
    for await (const h of p.handle.values()){
      if (h.kind === 'file'){ if (h.name === PJ_FILE) st.pj = true; continue; }
      const sub = SUBS.find(s => norm(s[1]) === norm(h.name));
      if (!sub){ st.extra.push(h.name); continue; }
      const info = { handle: h, name: h.name, files: 0, images: 0, pdfDoc: [], probenplan: 0, sicherungen: 0, daten: [], bu: false };
      for await (const f of h.values()){
        if (f.kind !== 'file' || f.name.startsWith('~$')) continue;
        info.files++;
        if (IMG_EXT.test(f.name)) info.images++;
        if (/bilddokumentation.*\.pdf$/i.test(f.name)) info.pdfDoc.push(f.name);
        // PlanKit legt bei jedem Speichern eine „(vorher …)“-Kopie an; Sicherungen sind keine eigenen Pläne
        if (/\.probenplan$/i.test(f.name)){ if (/ \((vorher|Wiederherstellung) [^)]*\)\.probenplan$/i.test(f.name)) info.sicherungen++; else info.probenplan++; }
        if (/_Daten\.json$/i.test(f.name)) info.daten.push(f.name);
        if (f.name === '_Bildumbenenner.json') info.bu = true;
      }
      st.subs[sub[0]] = info;
    }
  }catch(e){ st.err = e.message; }
  return st;
}
async function scanAll(token){
  const queue = [...S.projects];
  const prio = () => { const v = visibleProjects(); return v.find(p => !p.st && !p.scanning) || queue.find(p => !p.st && !p.scanning); };
  const worker = async () => {
    for (let p = prio(); p && token === S.scanToken; p = prio()){
      p.scanning = true;
      p.st = await scanProject(p);
      p.scanning = false;
      if (token !== S.scanToken) return;
      updateRow(p);
      if (S.sel === p) renderDetail();
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
}

/* ---------- list ---------- */
function visibleProjects(){
  const q = norm(S.q).trim();
  return S.projects.filter(p => (!S.year || p.yy === S.year) && (!q || norm(p.name).includes(q)));
}
function renderYears(){
  const ys = [...new Set(S.projects.map(p => p.yy))].sort((a, b) => b - a);
  $('years').innerHTML = ys.length > 1 ? ['', ...ys].map(y => `<button data-y="${y}" class="${S.year === y ? 'on' : ''}">${y ? '20' + y : 'Alle'}</button>`).join('') : '';
  $('years').querySelectorAll('button').forEach(b => b.onclick = () => { S.year = b.dataset.y; renderYears(); renderList(); });
}
function chipsHtml(p){
  if (!p.st) return '<span class="chip wait">…</span>';
  if (p.st.err) return `<span class="chip" title="${esc(p.st.err)}">nicht lesbar</span>`;
  const s = p.st.subs, out = [];
  const c = (cls, txt, title) => out.push(`<span class="chip ${cls}" title="${esc(title)}">${txt}</span>`);
  const fo = s.fotos;
  if (!fo) c('miss', 'Fotos –', 'Unterordner „Fotos“ fehlt');
  else c(fo.images ? 'yes' : '', `Fotos ${fo.images}`, `${fo.images} Bilder in „Fotos“`);
  if (fo && fo.pdfDoc.length) c('yes', 'Bilddoku ✓', fo.pdfDoc.join(', '));
  const pl = s.plaene;
  if (pl && (pl.probenplan || pl.files)) c(pl.probenplan ? 'yes' : '', pl.probenplan ? 'Plan ✓' : `Pläne ${pl.files}`, pl.probenplan ? `${pl.probenplan} PlanKit-Datei(en)` : `${pl.files} Datei(en) in „Pläne“`);
  const la = s.labauf;
  if (la && la.daten.length) c('yes', 'Proben ✓', la.daten.join(', '));
  const le = s.laberg;
  if (le && le.files) c('yes', `Ergebnisse ${le.files}`, `${le.files} Datei(en) in „Laborergebnisse“`);
  return out.join('');
}
function rowHtml(p){
  return `<div class="proj${S.sel === p ? ' active' : ''}" data-name="${esc(p.name)}">
    <span class="nr">${esc(p.nr)}</span>
    <span class="ort">${esc(p.ort || '–')}</span>
    <span class="chips">${chipsHtml(p)}</span></div>`;
}
function renderList(){
  if (!S.archive) return;
  const vis = visibleProjects();
  let html = `<div class="count">${vis.length} von ${S.projects.length} Projekt${S.projects.length === 1 ? '' : 'en'}</div>`;
  html += vis.map(rowHtml).join('');
  if (!S.projects.length) html += `<div class="empty"><p>In „${esc(S.archive.name)}“ wurden keine Projektordner gefunden. Erwartet werden Ordnernamen wie <code>26.0123 Köln</code>.</p></div>`;
  if (S.others.length && !S.q && !S.year){
    html += `<div class="group">Andere Ordner (kein Projektnummer-Schema)</div><div class="count">${S.others.map(o => esc(o.name)).join(' · ')}</div>`;
  }
  $('list').innerHTML = html;
  $('list').querySelectorAll('.proj').forEach(el => el.onclick = () => selectProject(S.projects.find(p => p.name === el.dataset.name)));
}
function updateRow(p){
  const el = [...$('list').querySelectorAll('.proj')].find(e => e.dataset.name === p.name);
  if (el) el.querySelector('.chips').innerHTML = chipsHtml(p);
}

/* ---------- detail ---------- */
async function selectProject(p){
  if (!p) return;
  await flushPJ();
  S.sel = p; S.pj = null; S.pjDirty = {}; S.anl = null;
  $('list').querySelectorAll('.proj').forEach(el => el.classList.toggle('active', el.dataset.name === p.name));
  if (!p.st){ p.scanning = true; p.st = await scanProject(p); p.scanning = false; updateRow(p); }
  S.pj = await readPJ(p.handle);
  if (S.sel !== p) return;
  renderDetail();
}
function folderRows(p){
  const s = p.st.subs;
  return SUBS.map(([key, , label]) => {
    const i = s[key];
    if (!i) return `<tr><td>${esc(label)}</td><td class="miss">fehlt</td></tr>`;
    let t = `${i.files} Datei${i.files === 1 ? '' : 'en'}`;
    if (key === 'fotos'){
      t = `${i.images} Bild${i.images === 1 ? '' : 'er'}` + (i.bu ? ' · bearbeitet in FotoKit' : '') +
          (i.pdfDoc.length ? ` · <span class="ok">Bilddokumentation: ${i.pdfDoc.map(esc).join(', ')}</span>` : '');
    }
    if (key === 'plaene' && i.probenplan) t += ` · <span class="ok">${i.probenplan === 1 ? 'Probenplan' : i.probenplan + ' PlanKit-Dateien'}</span>`;
    if (key === 'plaene' && i.sicherungen) t += ` · <span class="m">${i.sicherungen} Sicherungskopie${i.sicherungen === 1 ? '' : 'n'} von PlanKit</span>`;
    if (key === 'labauf') t += i.daten.length ? ` · <span class="ok">Probenerfassung: ${i.daten.map(esc).join(', ')}</span>` : ' · <span class="m">noch keine Probenerfassung (…_Daten.json)</span>';
    return `<tr><td>${esc(label)}</td><td>${t}</td></tr>`;
  }).join('') + (p.st.extra.length ? `<tr><td class="m">Weitere</td><td class="m">${p.st.extra.map(esc).join(', ')}</td></tr>` : '');
}
/* Stand der Arbeitsschritte aus dem Ordnerstand: erledigt (Haken), nächster Schritt (gefüllt). Nur eine Hilfe zur Orientierung – jede App bleibt jederzeit anklickbar. */
function arbeitsstand(p){
  const st = p.st && !p.st.err ? p.st : null, out = { label: {}, fotos: {}, plan: {}, beleg: {} };
  if (!st) return out;
  const lab = st.subs.labauf, fo = st.subs.fotos, pl = st.subs.plaene;
  out.label = lab && lab.daten.length ? { done: true, text: '✓ erfasst' } : { text: lab ? 'noch leer' : 'Ordner fehlt' };
  out.fotos = fo && fo.bu ? { done: true, text: `✓ ${fo.images} Bild${fo.images === 1 ? '' : 'er'}` } : { text: fo ? (fo.images ? `${fo.images} Bild${fo.images === 1 ? '' : 'er'}` : 'noch leer') : 'Ordner fehlt' };
  out.plan = pl && pl.probenplan ? { done: true, text: '✓ Probenplan' } : { text: pl ? 'noch kein Plan' : 'Ordner fehlt' };
  const next = ['label', 'fotos', 'plan'].find(k => !out[k].done);
  if (next) out[next].next = true; else out.beleg.next = true;
  return out;
}
function stepCard(id, app, nr, name, aufgabe, st, tip, extra, last){
  st = st || {};
  return `<div class="sw${st.done ? ' done' : ''}${st.next ? ' next' : ''}${last ? ' last' : ''}" data-app="${app}">
    <button class="step" id="${id}" title="${esc(tip)}"><span class="n">${st.done ? '✓' : nr}</span><span><span class="name">${esc(name)}</span><small>${esc(aufgabe)}</small></span><span class="stat">${esc(st.done ? st.text.replace(/^✓ /, '') : (st.text || ''))}</span></button>
    ${extra || ''}</div>`;
}
/* Projektdaten in drei Gruppen; Projektnummer und Schadenort stehen im Kopf (aus dem Ordnernamen). */
const PJ_GRUPPEN = [['Objekt und Auftrag', ['objekt', 'auftraggeber', 'schadennummer', 'auftragsdatum']], ['Schaden und Termine', ['schadenereignis', 'schadendatum', 'ortstermin', 'sachverstaendiger']],
  ['Beteiligte', ['versicherungsnehmer', 'sachverstaendigerBeteiligt', 'sanierung', 'kontakte']], ['', ['notizen']]];
function ordnerKurz(p){
  const s = p.st.subs, da = SUBS.filter(([k]) => s[k]).length, dateien = SUBS.reduce((n, [k]) => n + (s[k] ? s[k].files : 0), 0);
  return `${da} von ${SUBS.length} Unterordnern · ${dateien} Datei${dateien === 1 ? '' : 'en'}`;
}
function renderDetail(){
  const p = S.sel;
  if (!p){ $('detail').innerHTML = '<div class="empty"><p>Links ein Projekt auswählen.</p><p><button class="help-link" data-help>Kurzanleitung öffnen</button></p></div>'; return; }
  const pj = S.pj || { data: {} }, d = pj.data;
  const nrWarn = d.projektnummer && d.projektnummer !== p.nr ? `<div class="warn">Achtung: In „${PJ_FILE}“ steht Projektnummer ${esc(d.projektnummer)}, der Ordner heißt ${esc(p.nr)}. Maßgeblich ist der Ordnername.</div>` : '';
  const ro = pj.error || pj.newer, stand = arbeitsstand(p);
  // Wird neu gezeichnet, während jemand in den Projektdaten schreibt (Ordner fertig gelesen, Anlage erstellt …), bleibt der Cursor im Feld.
  const ae = document.activeElement, fokus = ae && /^pj_/.test(ae.id) && $('detail').contains(ae) ? { id: ae.id, a: ae.selectionStart, b: ae.selectionEnd } : null;
  const ok = p.st && !p.st.err, fehlend = ok ? SUBS.filter(([k]) => !p.st.subs[k]).map(([, n]) => n) : [];
  const summe = ['objekt', 'auftraggeber', 'schadennummer'].map(k => String(d[k] || '').trim()).filter(Boolean).join(' · ');
  S.pjOpen = S.pjOpen || {}; S.ordOpen = S.ordOpen || {}; S.vtOpen = S.vtOpen || {};
  const vst = verteilerStand(d.verteiler);
  const pjAuf = fokus || Object.keys(S.pjDirty).length ? true : p.name in S.pjOpen ? S.pjOpen[p.name] : (!!nrWarn || !!pj.error || !!pj.newer);
  const feld = k => { const [, label, type, wide, ph] = PJ_FIELDS.find(f => f[0] === k);
    return `<label class="${wide ? 'wide' : ''}">${esc(label)}
        ${type === 'area' ? `<textarea id="pj_${k}" rows="3" ${ro ? 'readonly' : ''}></textarea>`
          : `<input type="${type}" id="pj_${k}" placeholder="${esc(ph)}" ${ro ? 'readonly' : ''}>`}</label>`; };
  $('detail').innerHTML = `<div class="pz">
    <h2><span class="nr">${esc(p.nr)}</span> ${esc(p.ort)}</h2>
    <div class="sub">${esc(S.archive.name)} › ${esc(p.name)}</div>
    <details class="card${summe ? '' : ' leer'}" id="pjBox" ${pjAuf ? 'open' : ''}>
      <summary><span class="t">Projektdaten</span><span class="sum">${summe ? esc(summe) : 'noch leer – Arbeitszettel einlesen oder Objekt, Auftraggeber … eintragen'}</span>
        <span class="save" id="pjSave">${pj.exists ? (d.geaendert ? `Gespeichert ${esc(new Date(d.geaendert).toLocaleDateString('de-DE'))}` : '') : ''}</span></summary>
      <div class="body">
        ${nrWarn}
        ${pj.error ? `<div class="warn">„${PJ_FILE}“ ist nicht lesbar (${esc(pj.error)}) und wird nicht überschrieben.</div>` : ''}
        ${pj.newer ? `<div class="warn">„${PJ_FILE}“ stammt von einer neueren Version – bitte Projektzentrale aktualisieren. Nur Ansicht.</div>` : ''}
        ${ro ? '' : `<div class="azrow"><button id="azBtn" title="Liest Objekt, Versicherung, Schaden-Nr., Termine und Beteiligte aus dem PDF des Büro-Systems – vor dem Speichern wird jeder Wert angezeigt">📄 Arbeitszettel einlesen …</button>
          <span class="m">${d.arbeitszettel && d.arbeitszettel.datei ? `Zuletzt: ${esc(d.arbeitszettel.datei)}` : 'PDF wählen oder auf diese Karte ziehen'}</span><input type="file" id="azFile" accept="application/pdf,.pdf" hidden></div>`}
        <div class="form">${PJ_GRUPPEN.map(([g, ks]) => (g ? `<div class="grp">${esc(g)}</div>` : '') + ks.map(feld).join('')).join('')}</div>
        <div class="save m" title="${esc(PJ_FILE)} im Projektordner – gilt für alle Apps">${pj.exists ? (d.geaendert ? `Zuletzt gespeichert ${esc(new Date(d.geaendert).toLocaleString('de-DE'))}${d.geaendertMit ? ' mit ' + esc(d.geaendertMit) : ''}` : '') : 'Noch keine Projektdaten – wird beim ersten Eintrag angelegt.'} · gilt für alle Apps</div>
      </div>
    </details>
    <details class="card${vst.an ? '' : ' leer'}" id="vtBox" ${S.vtOpen[p.name] ? 'open' : ''}>
      <summary><span class="t">Verteiler</span><span class="sum">${esc(vst.text)}</span></summary>
      <div class="body"><div class="m vtHint">Wer bekommt das Gutachten? Empfänger anhaken, nach dem Versand das Datum eintragen.</div>${verteilerHtml(d, ro)}</div>
    </details>
    <div class="steps">
      ${stepCard('goLabel', 'label', 1, 'LabelKit', 'Proben erfassen', stand.label, 'Öffnet den Ordner „Laboraufträge“ dieses Projekts und speichert dort', '<div class="att" id="anl"></div>')}
      ${stepCard('goFotos', 'fotos', 2, 'FotoKit', 'Fotos bearbeiten', stand.fotos, 'Öffnet den Ordner „Fotos“ dieses Projekts und speichert dort')}
      ${stepCard('goPlan', 'plan', 3, 'PlanKit', 'Plan bearbeiten', stand.plan, 'Öffnet den Ordner „Pläne“ dieses Projekts und speichert dort',
        stand.plan.done ? `<div class="att"><div class="row"><b>Anlage Probenahme</b><span class="m">Lagepläne, Probenverzeichnis, Fotos, Laborwerte</span><button id="anlPlan" title="Öffnet PlanKit gleich im Export „Word · Anlage Probenahme“">Erstellen …</button></div></div>` : '')}
      ${stepCard('goAufwand', 'beleg', 4, 'BelegKit', 'Abrechnung', stand.beleg, 'Zeiten, km, Spesen eintragen; Proben, Berichtsseiten und Fotos für die Rechnung zusammenstellen – speichert im Ordner „Abrechnung“', '', true)}
    </div>
    ${fehlend.length ? `<div class="warnbar"><span>Es fehlen Unterordner: <b>${fehlend.map(esc).join(', ')}</b></span><button id="mkSubs">Anlegen</button></div>` : ''}
    <details class="card" id="ordBox" ${S.ordOpen[p.name] ? 'open' : ''}>
      <summary><span class="t">Ordner</span><span class="sum">${ok ? esc(ordnerKurz(p)) : p.st && p.st.err ? 'nicht lesbar' : 'wird gelesen …'}</span></summary>
      <div class="body">${ok ? `<table class="folders">${folderRows(p)}</table>` : `<div class="m">${p.st && p.st.err ? 'Nicht lesbar: ' + esc(p.st.err) : 'Wird gelesen …'}</div>`}</div>
    </details>
  </div>`;
  $('pjBox').addEventListener('toggle', () => { S.pjOpen[p.name] = $('pjBox').open; });
  $('ordBox').addEventListener('toggle', () => { S.ordOpen[p.name] = $('ordBox').open; });
  $('vtBox').addEventListener('toggle', () => { S.vtOpen[p.name] = $('vtBox').open; });
  if (!ro){
    $('azBtn').onclick = () => $('azFile').click();

  if (fokus && $(fokus.id)){ const el = $(fokus.id); el.focus(); try{ if (fokus.a != null) el.setSelectionRange(fokus.a, fokus.b); }catch(e){} }
  if (Object.keys(S.pjDirty).length){ $('pjSave').className = 'save'; $('pjSave').textContent = 'Änderungen werden gespeichert …'; }

function schedulePJ(){
  $('pjSave').className = 'save'; $('pjSave').textContent = 'Änderungen werden gespeichert …';
  clearTimeout(S.pjTimer); S.pjTimer = setTimeout(flushPJ, 600);
}
function flushPJ(){
  clearTimeout(S.pjTimer);
  const p = S.sel, patch = S.pjDirty;
  if (!p || !Object.keys(patch).length) return S.pjWriting;
  S.pjDirty = {};
  for (const k of Object.keys(patch)) patch[k] = patch[k].trim();
  S.pjWriting = S.pjWriting.then(async () => {
    try{
      const o = await patchPJ(p.handle, p.name, patch);
      if (S.sel === p){
        S.pj = { data: o, exists: true };
        const el = $('pjSave'); if (el){ el.className = 'save ok'; el.textContent = `✓ Gespeichert ${new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}`; el.title = `in ${PJ_FILE} im Projektordner`; }
      }
      if (p.st) p.st.pj = true;
    }catch(e){
      S.pjDirty = Object.assign({}, patch, S.pjDirty);   // newer edits win
      const el = $('pjSave'); if (el && S.sel === p){ el.className = 'save err'; el.textContent = 'Nicht gespeichert: ' + e.message; }
    }

/* ---------- Arbeitszettel einlesen ----------
   Das Büro-System druckt zu jedem Auftrag einen „Arbeitszettel“ als PDF (immer dieselbe Form). Die Projektzentrale liest ihn
   und schlägt die Projektdaten vor. Nichts wird geraten: Gelesen wird je Kasten unter seiner Überschrift (RISKO,
   VERSICHERUNGSNEHMER …), leere Kästen bleiben leer, und vor dem Speichern zeigt ein Dialog jeden Wert zum Bestätigen.
   Ordner werden dabei nie angelegt oder verändert – geschrieben wird nur „_Projekt.json“.
   Die PDF-Bibliothek (pdf.js, Apache-2.0) liegt in vendor/pdfjs und wird erst beim ersten Einlesen geladen. */
/* AZ-PARSER-START */
const AZ_MITARBEITER = { 'sebastian kasper': 'Dr. S. Kasper' };   // Schreibweise in den Gutachten
function azLeser(items){
  // items: [{ s: Text, x: links, y: Grundlinie von oben }] einer Seite
  const it = items.map(i => ({ s: String(i.s).normalize('NFC').replace(/\s+/g, ' ').trim(), x: +i.x, y: +i.y })).filter(i => i.s);
  // Überschriften genau so, wie sie auf dem Zettel stehen: „Sachverständiger“ und „Sanierung“ gibt es klein geschrieben auch im Verteiler.
  const kopf = t => it.find(i => i.s === t);
  const H = {};
  for (const t of ['RISKO', 'VERSICHERUNGSNEHMER', 'VERSICHERUNG', 'SACHVERSTÄNDIGER', 'SANIERUNG', 'SCHADEN VOM', 'SCHADENNUMMER',
                   'AUFTRAGSDATUM', 'MITARBEITER', 'ARBEITSAUFTRAG', 'ASP', 'ORTSTERMIN']) H[t] = kopf(t);
  H.REGULIERER = kopf('Regulierer'); H.VERTEILER = kopf('Verteiler');
  const fehlt = ['RISKO', 'VERSICHERUNGSNEHMER', 'VERSICHERUNG', 'SACHVERSTÄNDIGER', 'SANIERUNG', 'ARBEITSAUFTRAG'].filter(t => !H[t]);
  if (fehlt.length || !it.some(i => /^Sachverständigenbüro\b/i.test(i.s)))
    throw new Error('Das ist kein Arbeitszettel des Büros (es fehlen die Kästen ' + (fehlt.length ? fehlt.join(', ') : 'mit dem Briefkopf') + ').');
  const c0 = H.RISKO.x, c1 = H.VERSICHERUNGSNEHMER.x, c2 = H.VERSICHERUNG.x, T = 3;
  const unterAa = H.ORTSTERMIN ? H.ORTSTERMIN.y : Infinity;
  // Zeilen eines Bereichs: Textstücke mit (fast) gleicher Grundlinie gehören zusammen
  const zeilen = (x0, x1, y0, y1) => {
    const sel = it.filter(i => i.x >= x0 - T && i.x < x1 - T && i.y > y0 + 2 && i.y < y1 - 2).sort((a, b) => a.y - b.y || a.x - b.x);
    const out = [];
    for (const i of sel){ const z = out[out.length - 1]; if (z && Math.abs(z.y - i.y) < 2.5) z.t.push(i); else out.push({ y: i.y, t: [i] }); }
    return out.map(z => ({ y: z.y, s: z.t.sort((a, b) => a.x - b.x).map(i => i.s).join(' ') }));
  };
  // Kasten mit Name (ggf. umbrochen) und Anschrift: Namenszeilen stehen bis ~44 pt unter der Überschrift
  const kasten = (x0, x1, kopfY, y1) => {
    const z = zeilen(x0, x1, kopfY, y1);
    const name = z.filter(l => l.y < kopfY + 44).map(l => l.s).join(' ');
    const rest = z.filter(l => l.y >= kopfY + 44).map(l => l.s);
    return [name, ...rest].filter(Boolean).join(', ');
  };
  const r1Ende = Math.min(H.SACHVERSTÄNDIGER.y, H.REGULIERER ? H.REGULIERER.y : Infinity);
  const r2Ende = H.ARBEITSAUFTRAG.y;
  const z = {};
  const titel = it.filter(i => i.y < H.RISKO.y && /^\d{2}\.\d{4}\b/.test(i.s)).sort((a, b) => a.y - b.y)[0];
  z.titel = titel ? titel.s : '';
  z.projektnummer = titel ? titel.s.match(/^\d{2}\.\d{4}/)[0] : '';
  z.risko = kasten(c0, c1, H.RISKO.y, r1Ende);
  z.versicherungsnehmer = kasten(c1, c2, H.VERSICHERUNGSNEHMER.y, r1Ende);
  z.versicherung = kasten(c2, Infinity, H.VERSICHERUNG.y, r1Ende);
  z.sachverstaendiger = kasten(c0, c1, H.SACHVERSTÄNDIGER.y, r2Ende);
  z.sanierung = kasten(c1, c2, H.SANIERUNG.y, r2Ende);
  const feld = (k, x1, bis) => H[k] ? zeilen(H[k].x, x1, H[k].y, bis).map(l => l.s).join(' ') : '';
  z.regulierer = H.REGULIERER ? zeilen(c2, Infinity, H.REGULIERER.y, H['SCHADEN VOM'] ? H['SCHADEN VOM'].y : r2Ende).map(l => l.s).join(' ') : '';
  const bisAuftrag = H.AUFTRAGSDATUM ? H.AUFTRAGSDATUM.y : r2Ende;
  z.schadenVom = feld('SCHADEN VOM', H.SCHADENNUMMER ? H.SCHADENNUMMER.x : Infinity, bisAuftrag);
  z.schadennummer = feld('SCHADENNUMMER', Infinity, bisAuftrag);
  z.auftragsdatum = feld('AUFTRAGSDATUM', H.MITARBEITER ? H.MITARBEITER.x : Infinity, r2Ende);
  z.mitarbeiter = feld('MITARBEITER', Infinity, r2Ende);
  // „Termin: 15.10.2026“ rechts in der Zeile ARBEITSAUFTRAG (Datum kann ein eigenes Textstück sein)
  const term = it.find(i => /^Termin\b/i.test(i.s) && Math.abs(i.y - H.ARBEITSAUFTRAG.y) < 6);
  z.termin = term ? it.filter(i => Math.abs(i.y - term.y) < 2.5 && i.x >= term.x).sort((a, b) => a.x - b.x).map(i => i.s).join(' ').replace(/^Termin:?\s*/i, '') : '';
  // Arbeitsauftrag: links neben dem Verteiler, bis zur Tabelle ORTSTERMIN. „Anrufer“ und „ASP“ sind Unterüberschriften.
  const rechts = H.VERTEILER ? H.VERTEILER.x : (term ? term.x : Infinity);
  const aa = zeilen(c0, rechts, H.ARBEITSAUFTRAG.y, unterAa);
  const kontaktig = s => /\d{5,}|@/.test(s.replace(/[\s\-/]/g, '')) || /^(Hr|Fr|Herr|Frau)\b/i.test(s);
  z.anrufer = []; z.asp = []; const frei = [];
  let modus = '';
  for (const l of aa){
    const m = l.s.match(/^(Anrufer|ASP)\b:?\s*(.*)$/i);
    if (m){ modus = m[1].toLowerCase() === 'asp' ? 'asp' : 'anrufer'; if (m[2]) z[modus].push(m[2]); continue; }
    if (modus && kontaktig(l.s)) z[modus].push(l.s);
    else frei.push(l.s);
  }
  z.arbeitsauftrag = frei.join('\n');
  return z;
}
function azDatum(s){
  const m = String(s || '').trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : '';
}
function azFelder(z){
  /* Zettel → Felder in _Projekt.json; Hinweise statt stiller Annahmen */
  const f = {}, hinweise = [];
  f.objekt = z.risko;
  f.auftraggeber = z.versicherung;
  f.schadennummer = z.schadennummer;
  f.versicherungsnehmer = z.versicherungsnehmer;
  f.sachverstaendigerBeteiligt = z.sachverstaendiger;
  f.sanierung = z.sanierung;
  for (const [k, roh, name] of [['schadendatum', z.schadenVom, 'Schaden vom'], ['ortstermin', z.termin, 'Termin'], ['auftragsdatum', z.auftragsdatum, 'Auftragsdatum']]){
    f[k] = azDatum(roh);
    if (roh && !f[k]) hinweise.push(`„${name}“ ist kein Datum (${roh}) und wird nicht übernommen.`);
  }
  const ma = z.mitarbeiter.trim();
  f.sachverstaendiger = AZ_MITARBEITER[ma.toLowerCase()] || ma;
  if (ma && f.sachverstaendiger !== ma) hinweise.push(`Mitarbeiter „${ma}“ wird als „${f.sachverstaendiger}“ eingetragen.`);
  f.kontakte = [z.regulierer && 'Regulierer: ' + z.regulierer, z.anrufer.length && 'Anrufer: ' + z.anrufer.join(', '), z.asp.length && 'ASP: ' + z.asp.join(', ')].filter(Boolean).join('\n');
  f.arbeitsauftrag = z.arbeitsauftrag;
  if (f.ortstermin && f.auftragsdatum && f.ortstermin < f.auftragsdatum) hinweise.push(`Der Termin (${z.termin}) liegt vor dem Auftragsdatum (${z.auftragsdatum}) – bitte prüfen.`);
  if (f.schadendatum && f.auftragsdatum && f.schadendatum > f.auftragsdatum) hinweise.push(`Das Schadendatum (${z.schadenVom}) liegt nach dem Auftragsdatum (${z.auftragsdatum}) – bitte prüfen.`);
  return { f, hinweise };
}
/* AZ-PARSER-END */
const PDFJS = 'vendor/pdfjs/';
let pdfjsLaden = null;
function ladePdfjs(){
  if (!pdfjsLaden) pdfjsLaden = import(new URL(PDFJS + 'pdf.min.js', location.href).href).then(L => {
    L.GlobalWorkerOptions.workerSrc = new URL(PDFJS + 'pdf.worker.min.js', location.href).href;
    return L;
  }).catch(e => { pdfjsLaden = null; throw new Error(IS_WEB ? 'Die PDF-Bibliothek konnte nicht geladen werden (' + e.message + '). Bitte einmal online öffnen.'
    : 'Arbeitszettel einlesen geht nur in der Online-Version (Adresse aus dem Lesezeichen), nicht aus einer lokal geöffneten Datei.'); });
  return pdfjsLaden;
}
async function azTextstuecke(buf){
  const L = await ladePdfjs();
  const task = L.getDocument({ data: new Uint8Array(buf.slice(0)), isEvalSupported: false });
  try{
    const doc = await task.promise, seite = await doc.getPage(1), h = seite.getViewport({ scale: 1 }).height, t = await seite.getTextContent();
    return t.items.filter(i => i.str && i.str.trim()).map(i => ({ s: i.str, x: i.transform[4], y: h - i.transform[5] }));
  } finally { task.destroy(); }
}
window.MosaikArbeitszettel = { azLeser, azFelder, azTextstuecke };   // für Tests und Fehlersuche (nur lesen, schreibt nichts)
const AZ_FELDER = [   // Reihenfolge im Dialog
  ['objekt', 'Objekt (RISKO)'], ['auftraggeber', 'Auftraggeber / Versicherung'], ['schadennummer', 'Schaden-Nr.'], ['auftragsdatum', 'Auftragsdatum'],
  ['versicherungsnehmer', 'Versicherungsnehmer'], ['sachverstaendigerBeteiligt', 'Beteiligter Sachverständiger'], ['sanierung', 'Sanierung'],
  ['kontakte', 'Ansprechpartner'], ['schadendatum', 'Schadendatum'], ['ortstermin', 'Ortstermin'], ['sachverstaendiger', 'Sachverständiger'],
  ['arbeitsauftrag', 'Arbeitsauftrag → Notizen']
];
const azZeig = (k, v) => !v ? '' : (PJ_FIELDS.find(f => f[0] === k) || [])[2] === 'date' ? deDatum(v) : v;
function deDatum(iso){ const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${m[3]}.${m[2]}.${m[1]}` : String(iso || ''); }
async function arbeitszettelEinlesen(p, file){
  if (!p || S.sel !== p) return;
  if (S.pj && (S.pj.error || S.pj.newer)){ banner('err', `„${PJ_FILE}“ ist nicht beschreibbar – Arbeitszettel wird nicht übernommen.`); return; }
  let z, f, hinweise, sha;
  try{
    if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') throw new Error('Bitte den Arbeitszettel als PDF wählen.');
    const buf = await file.arrayBuffer();
    sha = await sha256Hex(buf);
    z = azLeser(await azTextstuecke(buf));
    ({ f, hinweise } = azFelder(z));
  }catch(e){ banner('err', 'Arbeitszettel nicht gelesen: ' + esc(e.message)); return; }
  await flushPJ();
  const d = (S.pj && S.pj.data) || {};
  const andereNr = z.projektnummer && z.projektnummer !== p.nr;
  const zeilen = AZ_FELDER.map(([k, label]) => {
    const neu = f[k] || '', ziel = k === 'arbeitsauftrag' ? 'notizen' : k, alt = String(d[ziel] || '').trim();
    let st, an;
    if (!neu){ st = 'leer auf dem Zettel'; an = null; }
    else if (k === 'arbeitsauftrag'){ if (alt.includes(neu)){ st = 'schon in den Notizen'; an = null; } else { st = alt ? 'wird angehängt' : 'neu'; an = true; } }
    else if (alt === neu){ st = 'gleich'; an = null; }
    else if (!alt){ st = 'neu'; an = true; }
    else { st = 'überschreibt: ' + azZeig(k, alt); an = false; }
    return `<tr data-k="${k}"><td>${an === null ? '' : `<input type="checkbox" id="az_${k}" ${an && !andereNr ? 'checked' : ''}>`}</td>
      <td><label for="az_${k}">${esc(label)}</label></td><td class="v">${neu ? esc(azZeig(k, neu)).replace(/\n/g, '<br>') : '<span class="m">–</span>'}</td>
      <td class="st${an === false ? ' warn' : ''}">${esc(st)}</td></tr>`;
  }).join('');
  showDialog(`<h3>Arbeitszettel übernehmen</h3>
    <div class="m">${esc(file.name)} · Zettel „${esc(z.titel || '?')}“ → Projekt <b>${esc(p.name)}</b></div>
    ${andereNr ? `<div class="azwarn"><b>Andere Projektnummer:</b> Der Zettel gehört zu ${esc(z.projektnummer)}, dieses Projekt ist ${esc(p.nr)}.
      <label><input type="checkbox" id="azTrotz"> Trotzdem in ${esc(p.nr)} übernehmen</label></div>` : ''}
    ${hinweise.map(h => `<div class="warn">${esc(h)}</div>`).join('')}
    <div class="aztab"><table><tbody>${zeilen}</tbody></table></div>
    <div class="m">Angehakte Werte werden in „${PJ_FILE}“ gespeichert. Bereits ausgefüllte Felder werden nur überschrieben, wenn du sie anhakst. Ordner werden nicht verändert.</div>
    <div class="btns"><button id="azAbbr">Abbrechen</button><button class="primary" id="azOk">Übernehmen</button></div>`);
  $('dialog').classList.add('az');
  const ok = $('azOk'), sperr = () => { ok.disabled = andereNr && !$('azTrotz').checked; };
  if (andereNr) $('azTrotz').addEventListener('change', sperr);
  sperr();
  $('azAbbr').onclick = closeDialog;
  ok.onclick = async () => {
    const patch = {};
    for (const [k] of AZ_FELDER){
      const cb = $('az_' + k); if (!cb || !cb.checked) continue;
      if (k === 'arbeitsauftrag'){ const alt = String(d.notizen || '').trim(); patch.notizen = alt ? alt + '\n\nArbeitsauftrag: ' + f[k] : 'Arbeitsauftrag: ' + f[k]; }
      else patch[k] = f[k];
    }
    patch.arbeitszettel = { datei: file.name, sha256: sha, titel: z.titel, eingelesen: new Date().toISOString() };
    closeDialog();
    await S.pjWriting;
    try{
      const o = await patchPJ(p.handle, p.name, patch);
      if (S.sel === p){ S.pj = { data: o, exists: true }; S.pjOpen[p.name] = true; renderDetail(); }
      if (p.st) p.st.pj = true;
      const n = Object.keys(patch).length - 1;
      banner('ok', `Arbeitszettel übernommen: ${n} Feld${n === 1 ? '' : 'er'} in „${esc(PJ_FILE)}“ gespeichert.`);
      setTimeout(hideBanner, 5000);
    }catch(e){ banner('err', 'Nicht gespeichert: ' + esc(e.message)); }
  };
}

/* ---------- Verteiler: wer bekommt das Gutachten, wann versandt ----------
   Auf dem Arbeitszettel gibt es den Verteiler (Versicherung, Sachverständiger, Versicherungsnehmer, Sanierung). Hier wird er geführt:
   Empfänger festlegen, Versanddatum eintragen. Gespeichert als „verteiler“ in _Projekt.json. */
const VERTEILER = [['versicherung', 'Versicherung', 'auftraggeber'], ['sachverstaendiger', 'Sachverständiger', 'sachverstaendigerBeteiligt'],
                   ['versicherungsnehmer', 'Versicherungsnehmer', 'versicherungsnehmer'], ['sanierung', 'Sanierung', 'sanierung']];
function verteilerStand(v){
  v = v && typeof v === 'object' ? v : {};
  const an = VERTEILER.filter(([k]) => v[k] && v[k].an), raus = an.filter(([k]) => v[k].versandt);
  return { an: an.length, raus: raus.length,
    text: !an.length ? 'noch nicht festgelegt – wer bekommt das Gutachten?' : raus.length === an.length ? `✓ an alle ${an.length} versandt` : `${an.length} Empfänger · ${raus.length} versandt` };
}
function verteilerHtml(d, ro){
  const v = d.verteiler && typeof d.verteiler === 'object' ? d.verteiler : {};
  return `<table class="vt">${VERTEILER.map(([k, label, feld]) => {
    const e = v[k] || {}, wer = String(d[feld] || '').split(',')[0].trim();
    return `<tr data-k="${k}"><td><label><input type="checkbox" class="vtAn" ${e.an ? 'checked' : ''} ${ro ? 'disabled' : ''}> ${esc(label)}</label></td>
      <td class="m">${wer ? esc(wer) : 'nicht eingetragen'}</td>
      <td><label class="vtD">versandt am <input type="date" class="vtAm" value="${esc(e.versandt || '')}" ${ro || !e.an ? 'disabled' : ''}></label>
      ${ro || !e.an || e.versandt ? '' : '<button class="vtHeute" title="Heute als Versanddatum eintragen">heute</button>'}</td></tr>`;
  }).join('')}</table>`;
}
async function verteilerSetzen(p, k, aenderung){
  await S.pjWriting;
  S.pjWriting = S.pjWriting.then(async () => {
    try{
      const cur = await readPJ(p.handle);
      const v = Object.assign({}, cur.data.verteiler && typeof cur.data.verteiler === 'object' ? cur.data.verteiler : {});
      v[k] = Object.assign({}, v[k] || {}, aenderung);
      if (!v[k].an) v[k] = { an: false };
      const o = await patchPJ(p.handle, p.name, { verteiler: v });
      if (S.sel === p){ S.pj = { data: o, exists: true }; renderDetail(); }
    }catch(e){ banner('err', 'Verteiler nicht gespeichert: ' + esc(e.message)); }
  });
  return S.pjWriting;
}

async function makeSubs(p){
  const miss = SUBS.filter(([k]) => !p.st.subs[k]).map(s => s[1]);
  if (!(await confirmDialog('Fehlende Unterordner anlegen?', `In „${p.name}“ werden angelegt: <b>${miss.map(esc).join(', ')}</b>`, 'Anlegen'))) return;
  try{
    for (const n of miss) await p.handle.getDirectoryHandle(n, { create: true });
  }catch(e){ banner('err', 'Unterordner konnten nicht angelegt werden: ' + esc(e.message)); }
  p.st = await scanProject(p); updateRow(p); renderDetail();
}

async function openApp(p, base, target){
  await flushPJ();

  const url = new URL(base, location.href);

}
async function openPlanKit(p, aktion){
  await flushPJ();

/* ---------- Anlagen zum Gutachten (Word) ----------
   Liest die neueste LabelKit-Projektdatei (…_Daten.json) aus „Laboraufträge“ und erstellt daraus eine Word-Anlage
   (DOCX/ANLAGE oben). Gespeichert wird in „Mitteilungen“ neben dem Bericht – datiert, nie überschreibend –, und jede
   erstellte Anlage wird mit Prüfsummen von Quelle und Ergebnis in „_Anlagen-Protokoll.txt“ vermerkt.            */
const ANL_ORDNER = 'Mitteilungen';
const ANL_PROTOKOLL = '_Anlagen-Protokoll.txt';
async function sha256Hex(buf){ const h = await crypto.subtle.digest('SHA-256', buf); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); }
const heuteIso = () => { const d = new Date(), z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; };
async function neuesteDaten(p){
  const la = p.st && p.st.subs.labauf; if (!la || !la.daten.length) return null;
  let best = null;
  for (const n of la.daten){ try{ const f = await (await la.handle.getFileHandle(n)).getFile(); if (!best || f.lastModified > best.lastModified) best = f; }catch(e){} }
  return best;
}
async function anlOrdner(p, erstellen){
  const m = p.st && p.st.subs.mitteil;
  if (m) return m.handle;
  for await (const h of p.handle.values()) if (h.kind === 'directory' && norm(h.name) === norm(ANL_ORDNER)) return h;
  return erstellen ? p.handle.getDirectoryHandle(ANL_ORDNER, { create: true }) : null;
}
async function anlVorhandene(p){
  const dir = await anlOrdner(p, false).catch(() => null), namen = [];
  if (dir) for await (const h of dir.values()) if (h.kind === 'file') namen.push(h.name);
  return namen;
}
const anlArt = (pn98, brand) => [pn98 && 'PN98', brand && 'Brandgeruch'].filter(Boolean).join('-');
function anlTitelGespeichert(p){ try{ return localStorage.getItem('pz-anlage-titel:' + p.name) || ''; }catch(e){ return ''; } }
function anlTitelMerken(p, v){ try{ localStorage.setItem('pz-anlage-titel:' + p.name, v); }catch(e){} }

/** Scans der PN 98-Feldbögen im Ordner „Feldprotokolle“ nachprüfen (SHA-256 wie bei der Ablage in LabelKit);
    stimmige JPEG/PNG werden für die Anlage verkleinert. Liefert {recId: [scan + status (+ bild)]}. */
const ANL_SCANORDNER = 'Feldprotokolle';
async function anlScansPruefen(p, recs){
  const aus = {};
  if (!recs.length) return aus;
  let dir = null;
  for await (const h of p.handle.values()) if (h.kind === 'directory' && norm(h.name) === norm(ANL_SCANORDNER)){ dir = h; break; }
  for (const r of recs){
    aus[r.id] = [];
    for (const sc of (r.scans || [])){
      const x = Object.assign({}, sc, { status: 'fehlt' });
      aus[r.id].push(x);
      if (sc.ungueltig || !dir) continue;
      let file;
      try{ file = await (await dir.getFileHandle(sc.datei)).getFile(); }catch(e){ continue; }
      const buf = await file.arrayBuffer();
      x.status = (await sha256Hex(buf)) === String(sc.sha256 || '').toLowerCase() ? 'ok' : 'abweichend';
      if (x.status === 'ok' && /\.(jpe?g|png)$/i.test(sc.datei)) x.bild = await anlBildVerkleinern(new Blob([buf], { type: /\.png$/i.test(sc.datei) ? 'image/png' : 'image/jpeg' })).catch(() => null);
    }
  }
  return aus;
}
async function anlBildVerkleinern(blob){
  const bmp = await createImageBitmap(blob), f = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * f)), h = Math.max(1, Math.round(bmp.height * f));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(bmp, 0, 0, w, h); bmp.close && bmp.close();
  const out = await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Bild nicht umwandelbar')), 'image/jpeg', 0.85));
  return { data: new Uint8Array(await out.arrayBuffer()), ext: 'jpg', widthPx: w, heightPx: h };
}

/** Anlage erstellen: Quelle frisch lesen und hashen, Word-Datei bauen, nie überschreibend speichern, zurücklesen, protokollieren. */
async function anlErstellen(p, o){
  const a = S.anl;
  if (!window.crypto || !crypto.subtle) throw new Error('Dieser Browser kann keine Prüfsummen berechnen – bitte Chrome oder Edge verwenden.');
  const quelle = await (await p.st.subs.labauf.handle.getFileHandle(a.f.name)).getFile();   // frisch: falls LabelKit inzwischen gespeichert hat
  const buf = await quelle.arrayBuffer(), sha = await sha256Hex(buf);
  const daten = JSON.parse(new TextDecoder().decode(buf));
  const jetzt = new Date().toISOString();
  const scans = o.pn98 ? await anlScansPruefen(p, ANLAGE.feldPn98(daten)) : {};
  const r = ANLAGE.pn98Brand(daten, { projektNr: p.nr, ort: p.ort, titel: o.titel, pn98: o.pn98, brand: o.brand, erstellt: jetzt, scans,
    anwendung: 'Projektzentrale ' + APP_VERSION,
    quelle: { pfad: p.st.subs.labauf.name + '/' + quelle.name, geaendert: new Date(quelle.lastModified).toISOString(), version: daten.version, sha256: sha } });
  const bytes = DOCX.build({ title: `${o.titel}: ${r.teile.join(' und ')} – Projekt ${p.nr}`, author: 'Projektzentrale ' + APP_VERSION, application: 'Projektzentrale ' + APP_VERSION, created: jetzt, blocks: r.blocks });
  const dir = await anlOrdner(p, true);
  const namen = []; for await (const h of dir.values()) namen.push(h.name);
  const name = ANLAGE.dateiname(p.nr, o.titel, anlArt(r.mitPn98, r.mitBrand), heuteIso(), namen);
  let gibtEs = false; try{ await dir.getFileHandle(name); gibtEs = true; }catch(e){}
  if (gibtEs) throw new Error(`„${name}“ existiert bereits – nichts überschrieben.`);
  const fh = await dir.getFileHandle(name, { create: true });
  const w = await fh.createWritable(); await w.write(bytes); await w.close();
  const shaDocx = await sha256Hex(bytes);
  if (await sha256Hex(await (await fh.getFile()).arrayBuffer()) !== shaDocx) throw new Error(`„${name}“ wurde nicht vollständig geschrieben – bitte erneut erstellen.`);
  try{
    const ph = await dir.getFileHandle(ANL_PROTOKOLL, { create: true }), alt = await ph.getFile();
    const kopf = alt.size ? '' : 'Anlagen-Protokoll (Projektzentrale) – je Zeile: Zeit (UTC) | Anlage | SHA-256 der Anlage | Quelle | SHA-256 der Quelle | Programm\r\n';
    const zeile = [jetzt, name, shaDocx, p.st.subs.labauf.name + '/' + quelle.name, sha, 'Projektzentrale ' + APP_VERSION].join(' | ') + '\r\n';
    const pw = await ph.createWritable({ keepExistingData: true }); await pw.write({ type: 'write', position: alt.size, data: kopf + zeile }); await pw.close();
  }catch(e){ /* Protokoll ist Zusatz – die Anlage selbst trägt den Quellenvermerk */ }
  const nFeld = r.mitPn98 ? r.pruefung.feld : 0, abw = Object.values(scans).flat().filter(x => x.status === 'abweichend' || x.status === 'fehlt').length;
  const seiten = [nFeld && `${nFeld} Feldprotokoll${nFeld === 1 ? '' : 'e'} PN 98` + (abw ? ` – ACHTUNG: ${abw} Scan${abw === 1 ? '' : 's'} fehlt oder weicht ab` : ''),
    r.mitPn98 && r.pruefung.pn98 && `${r.pruefung.pn98} PN 98-Protokoll${r.pruefung.pn98 === 1 ? '' : 'e'}`, r.mitBrand && `Brandgeruch ${r.pruefung.brand} Proben`].filter(Boolean).join(', ');
  return { name, seiten, sha: shaDocx };
}
