name: Spektron integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spektron-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify current checkout and pinned dependency provenance
        run: node --test tests/integration/provenance.test.mjs
      - name: Prepare pinned dependency applications
        run: node tests/integration/prepare.mjs
      - name: Existing Playwright browser runtime
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/spektron-pw" playwright@1.56.1
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/spektron-pw/node_modules/playwright" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/spektron-pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real producer and consumer flow
        run: node tests/integration/run.mjs --security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spektron-integration-results
          path: tests/integration/results/
          if-no-files-found: warn
          retention-days: 7
