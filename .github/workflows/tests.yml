name: Automated tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node tests (no browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node tests/docx.cjs
      - run: node tests/anlage.cjs
      - run: node tests/arbeitszettel.cjs
      - run: node tests/sw.cjs
      - run: node tests/buero.cjs
      - run: node tests/buero-f5.cjs
      - run: node tests/buero-n1.cjs
      - run: node tests/project-store.cjs

  browser-tests:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Playwright (pinned, not part of the repository)
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Annex PN 98 / odour in the real browser
        run: node tests/anlage-browser.cjs ${{ matrix.browser }}
      - name: Pre-select last opened project in the real browser
        run: node tests/zuletzt-browser.cjs ${{ matrix.browser }}
      - name: Read an Arbeitszettel PDF in the real browser
        run: node tests/arbeitszettel-browser.cjs ${{ matrix.browser }}
      - name: Office handover and independent shared sessions
        run: node tests/buero-browser.cjs ${{ matrix.browser }}
      - name: Native office attempt persistence (Chromium OPFS and IndexedDB)
        if: matrix.browser == 'chromium'
        run: node tests/buero-n1-native.cjs
      - name: Compact project view and native browser zoom
        if: matrix.browser == 'chromium'
        run: node tests/projektansicht-browser.cjs
      - name: Project switch after a failed save
        run: node tests/wechsel-browser.cjs ${{ matrix.browser }}
      - name: Independent F3 sessions and explicit recovery (synthetic shared disk)
        run: node tests/project-store-browser.cjs ${{ matrix.browser }}
