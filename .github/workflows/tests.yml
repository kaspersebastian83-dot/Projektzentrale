name: Automated tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node tests (no browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Vorlage des gemeinsamen Moduls: hier nur die Ortsregel prüfen (die anderen Apps vergleichen byte-genau hiermit)
      - run: node tests/spektron-ordner.cjs
      - run: node tests/spektron-umzug.cjs
      - run: node tests/docx.cjs
      - run: node tests/anlage.cjs
      - run: node tests/arbeitszettel.cjs
      - run: node tests/sw.cjs
      - name: BüroKit daneben holen (gemeinsames Modul byte-gleich prüfen)
        env:
          ZWEIG: ${{ github.head_ref }}
        # gleichnamiger Zweig in BüroKit, falls es ihn gibt (Änderung in beiden Repos), sonst main
        run: git clone --quiet --depth 1 --branch "$ZWEIG" https://github.com/kaspersebastian83-dot/buerokit.git ../buerokit 2>/dev/null || git clone --quiet --depth 1 https://github.com/kaspersebastian83-dot/buerokit.git ../buerokit
      - run: node tests/buero-aufgaben-gleich.cjs
        env:
          BUEROKIT_PFLICHT: '1'
      - run: node tests/project-store.cjs
      - run: node tests/ordnername.cjs
      - run: node tests/durchlauf.cjs
      - run: node tests/archiv.cjs
      - run: node tests/hilfe-links.cjs
      - run: node tests/rueckmeldung-link.cjs
      - run: node tests/stufen.cjs

  browser-tests:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Playwright (pinned, not part of the repository)
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Annex PN 98 / odour in the real browser
        run: node tests/anlage-browser.cjs ${{ matrix.browser }}
      - name: Pre-select last opened project in the real browser
        run: node tests/zuletzt-browser.cjs ${{ matrix.browser }}
      - name: Read an Arbeitszettel PDF in the real browser
        run: node tests/arbeitszettel-browser.cjs ${{ matrix.browser }}
      - name: Data archive reads lab XML from all projects
        run: node tests/archiv-browser.cjs ${{ matrix.browser }}
      - name: Workload overview per person and step
        run: node tests/auslastung-browser.cjs ${{ matrix.browser }}
      - name: Compact project view, hand-over to BüroKit and native browser zoom
        if: matrix.browser == 'chromium'
        run: node tests/projektansicht-browser.cjs
      - name: Project list in groups, „Heute für dich“, „Jetzt dran“ and the „Mehr“ menu
        if: matrix.browser == 'chromium'
        run: node tests/heute-browser.cjs
      - name: Project switch after a failed save
        run: node tests/wechsel-browser.cjs ${{ matrix.browser }}
      - name: Independent F3 sessions and explicit recovery (synthetic shared disk)
        run: node tests/project-store-browser.cjs ${{ matrix.browser }}
      - name: Responsible person from the folder name, staff list and project data
        run: node tests/zustaendig-browser.cjs ${{ matrix.browser }}
